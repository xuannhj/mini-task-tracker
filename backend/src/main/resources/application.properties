spring.application.name=backend

# 1. Cổng chạy của Backend
server.port=6971

# 2. Cấu hình kết nối H2 Database (Chạy trên RAM - In-Memory)
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. Bật giao diện web H2 Console để quản lý Database trực quan
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 4. Cấu hình JPA / Hibernate
# ddl-auto=update: Tự động tạo/cập nhật bảng trong DB từ class Java
spring.jpa.hibernate.ddl-auto=update

# In câu lệnh SQL ra cửa sổ Console của IntelliJ để quan sát
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true